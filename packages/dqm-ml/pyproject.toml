[project]
name = "dqm-ml"
dynamic = ["version","dependencies"]
description = "Python library designed to compute data quality metrics for Machine Learning"
authors = [
  {name = "Safenai", email="support@safenai.io"},   
]

license ="Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ml", "metrics", "data"]
classifiers = [
    "Development Status :: 4 - Beta",

    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]

notebooks = [
    "jupyter>=1.0.0",
    "plotly>=5.0.0",
]

job = [ "dqm-ml-job>=2.0.0rc0"]
pytorch = [ "dqm-ml-images>=2.0.0rc0"]
images = [ "dqm-ml-images>=2.0.0rc0"]

all = [
     "dqm-ml[notebooks, job, pytorch, images]",
 ]




[project.urls]
Homepage = "https://irt-systemx.github.io/dqm-ml"
Documentation = "https://irt-systemx.github.io/dqm-ml"
Repository = "https://github.com/IRT-SystemX/dqm-ml"

[project.scripts]
dqm-ml = "dqm_ml.__main__:execute"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "src/dqm_ml/_version_.py"
root= "../.."
