# yaml-language-server: $schema=../../../docs/schema/config.json
## Domain Gap with Split — compare distributions across subsets
##
## Splits the dataset by `source` (zoo, safari, reserve) so the pipeline
## creates three selections. The Domain Gap processor then measures the
## FID between every pair of selections, revealing distribution shifts
## between acquisition environments.
##
## Before running, generate the data file:
##     python examples/script/generate_data.py
##
## Usage:
##     dqm-ml process -p examples/config/scenario/domain_gap_with_split.yaml
##
## See also: docs/metrics/domain_gap.md, docs/configuration.md#split

---

dataloaders:
  loaders:
    - name: animals
      type: parquet
      path: examples/data/samples_with_images.parquet
      batch_size: 500
      split:
        by: source
        values: [zoo, safari, reserve]

features:
  outputs:
    path: examples/outputs/story_domain_gap_split_features.parquet
    include:
      - sample_id
      - source
  processors:
    - name: embedding
      type: features_embeddings
      columns:
        input: [image_bytes]
      model:
        arch: resnet18
        n_layer_feature: -2
      infer:
        batch_size: 32
        width: 64
        height: 64
        norm_mean: [0.485, 0.456, 0.406]
        norm_std: [0.229, 0.224, 0.225]

gap:
  outputs:
    path: examples/outputs/story_gap_split.parquet
  processors:
    - name: fid_gap
      type: domain_gap
      columns:
        input: [image_bytes_embedding]
      distance:
        metric: fid
        epsilon: 1e-6
