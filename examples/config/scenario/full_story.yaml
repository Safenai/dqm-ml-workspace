# yaml-language-server: $schema=../../../docs/schema/config.json
## Full Story — end-to-end DQM-ML pipeline
##
## Single pipeline running all metric types on images data:
##   1. Extract visual features (luminosity, contrast, blur, entropy)
##   2. Compute deep embeddings (ResNet-18, 512-d)
##   3. Check completeness of extracted features
##   4. Measure class diversity
##   5. Validate representativeness of feature distributions
##   6. Measure domain gaps between acquisition environments
##
## Data: examples/data/samples_with_images.parquet
##   Contains 1200 synthetic 32×32 animal images from zoo, safari,
##   and reserve sources, with metadata (class_name, sample_id, source).
##
## Before running:
##     python examples/script/generate_data.py
##
## Usage:
##     dqm-ml process -p examples/config/scenario/full_story.yaml
##
## See also: docs/examples/overview.md

---

dataloaders:
  loaders:
    - name: safari
      type: parquet
      path: examples/data/samples_with_images.parquet
      batch_size: 500
      filters:
        - column: source
          values: [safari]
      split:
        by: class_name
        values: [elephant, zebra]

    - name: reserve
      type: parquet
      path: examples/data/samples_with_images.parquet
      batch_size: 500
      filters:
        - column: source
          values: [reserve]
      split:
        by: class_name
        values: [elephant, zebra]

    - name: zoo
      type: parquet
      path: examples/data/samples_with_images.parquet
      batch_size: 500
      filters:
        - column: source
          values: [zoo]
      split:
        by: class_name
        values: [elephant, zebra]

features:
  outputs:
    path: examples/outputs/story_full_story_features.parquet
    include:
      - sample_id
      - source
      - class_name
  processors:
    - name: visual_features
      type: image_features
      columns:
        input: [image_bytes]
      features: [luminosity, contrast, blur, entropy]
      grayscale: true
      normalize: true
      histogram:
        bins: 256
      laplacian_kernel: 3x3

    - name: embedding
      type: features_embeddings
      columns:
        input: [image_bytes]
      model:
        arch: resnet18
        n_layer_feature: -2
      infer:
        batch_size: 32
        width: 64
        height: 64
        norm_mean: [0.485, 0.456, 0.406]
        norm_std: [0.229, 0.224, 0.225]

metrics:
  outputs:
    path: examples/outputs/full_story_metrics.parquet
  processors:
    - name: completeness
      type: completeness
      columns:
        input: [quality_score, image_bytes_luminosity, image_bytes_contrast, image_bytes_blur, image_bytes_entropy]
      include_per_column: true
      include_overall: true

    - name: diversity
      type: diversity
      columns:
        input: [class_name]
      metrics: [simpson, gini, shannon, richness]

    - name: representativeness
      type: representativeness
      columns:
        input: [image_bytes_luminosity, image_bytes_contrast, image_bytes_blur, image_bytes_entropy]
      metrics: [chi-square, grte, shannon-entropy, kolmogorov-smirnov]
      distribution: normal
      histogram:
        bins: 20

gap:
  outputs:
    path: examples/outputs/full_story_gap.parquet
  processors:
    - name: fid_gap
      type: domain_gap
      columns:
        input: [image_bytes_embedding]
      distance:
        metric: fid
        epsilon: 1e-6

    - name: mmd_rbf_gap
      type: domain_gap
      columns:
        input: [image_bytes_embedding]
      distance:
        metric: mmd_rbf
        kernel_params:
          gamma: 1.0

    - name: wasserstein_gap
      type: domain_gap
      columns:
        input: [image_bytes_embedding]
      distance:
        metric: wasserstein_1d
