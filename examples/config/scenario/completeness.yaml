# yaml-language-server: $schema=../../../docs/schema/config.json
## Completeness (Scenario) — check visual-feature columns for nulls
##
## Checks every sample for missing values in the visual-feature columns
## computed by the Visual Features pipeline. Nulls here indicate an
## image-processing failure (corrupt bytes, load error, etc.).
##
## Prerequisite: run the Visual Features pipeline first:
##     dqm-ml process -p examples/config/scenario/visual_features.yaml
##
## Usage:
##     dqm-ml process -p examples/config/scenario/completeness_scenario.yaml
##
## See also: docs/metrics/completeness.md

---

dataloaders:
  loaders:
    - name: source_dataset
      type: parquet
      path: examples/outputs/story_visual_features.parquet
      batch_size: 50000

metrics:
  outputs:
    path: examples/outputs/story_completeness.parquet
  processors:
    - name: completeness
      type: completeness
      columns:
        input: [sample_id, image_bytes_luminosity, image_bytes_contrast, image_bytes_blur, image_bytes_entropy]
      include_per_column: true
      include_overall: true
