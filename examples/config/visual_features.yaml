## Yaml pipeline configuration

---
# A really basic pipeline configuration
pipeline_config: 

  # Configuration for the data loader
  dataloaders:
    source_dataset:
      type: parquet
      path: /tmp/raw_samples/samples_raw_with_inference.parquet
      batch_size: 50000
      memory_limit: 2GB
      threads: 4


  metrics_processor:

    visual_features:
      type: visual_metric
      input_columns: [image_bytes]      
      output_features:  # List of output columns to compute associate to metric processor capabilities
        blur_level : m_blur_level
        entropy : m_entropy
        contrast : m_contrast
        luminosity : m_luminosity
     
      output_metrics: None
      
      metrics: [luminosity, contrast, blur, entropy]

      # Image processing settings
      grayscale: true
      normalize: true
      entropy_bins: 256
      laplacian_kernel: 3x3  # or 5x5 for more accuracy

  outputs :
    features :
      type: parquet
      path_pattern: features/samples_raw_with_inference.parquet
      columns: [
        # Identifiers
        sample_id,
        sample_type,
        
        # Class information
        class_id,
        class_name,
        
        transform_id,
        transform_name,
        transform_level,
        transform_params,
        
        split,
        
        #model_name,
        
        # # Adversarial predictions
        # orig_pred,
        # aug_pred,
        # is_success,
        
        # Computed visual features
        m_blur_level,
        m_entropy,
        m_contrast,
        m_luminosity
      ]
      compression: snappy  
      
