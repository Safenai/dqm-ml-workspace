# Set strict to true to turn warnings into errors to catch warnings within CI.
strict: false
use_directory_urls: false
validation:
  omitted_files: ignore
  absolute_links: warn
  unrecognized_links: ignore
  anchors: ignore
theme:
  name: material
  # By default, fonts are pulled from Google on the Internet. To support offline usage, this is
  # disabled.
  font: false
  # palette:
  #   scheme: slate
  #   primary: green
  #   accent: yellow
  palette: 
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/math-integral-box
    # GitHub specific.
    repo: fontawesome/brands/github
  favicon: static/math-integral-box.png
  mermaid:
    version: 9.4.0
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.indexes
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.prune

markdown_extensions:
  - abbr
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - md_in_html

extra_css:
  - static/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Safenai/dqm-ml-workspace
plugins:
  - mkdocs-simple-hooks:
      hooks:
        on_pre_build: "docs.hooks:pre_build"
  - mkdocs-jupyter:
      theme: dark
  - search
  - offline:
      enabled: !ENV [MKDOCS_MATERIAL_OFFLINE, false]
  - mermaid2:
      version: "9.4.0"
  - mkdocstrings:
      handlers:
        python:
          options:
            show_if_no_docstring: true
            show_signature_annotations: true
  # Autodoc configuration.
  # https://github.com/tlambert03/mkdocs-api-autonav#configuration
  - api-autonav:
      modules: [
        "packages/dqm-ml-core/src/dqm_ml_core/",
        "packages/dqm-ml-images/src/dqm_ml_images/",
        "packages/dqm-ml-job/src/dqm_ml_job/",
        "packages/dqm-ml-pytorch/src/dqm_ml_pytorch/",
      ]
  # This plugin is used to validate URLs (including anchors).
  - htmlproofer:
      # This is not enabled by default because this requires network I/O, so it is inherently not
      # exactly reproducible. For larger projects, this can also slow local build times.
      validate_external_urls: !ENV [HTMLPROOFER_VALIDATE_EXTERNAL_URLS, false]
      enabled: !ENV [MKDOCS_HTMLPROOFER_ENABLED, false]
      raise_error: false
watch:
  # Watch directories to reload on changes to docstrings for mkdocstrings plugin.
  - "packages/dqm-ml-core/src/dqm_ml_core/"
  - "packages/dqm-ml-images/src/dqm_ml_images/"
  - "packages/dqm-ml-job/src/dqm_ml_job/"
  - "packages/dqm-ml-pytorch/src/dqm_ml_pytorch/"
  - "docs"
site_name: DQM-ML V2
copyright: Copyright &copy; SafenAI
# GitHub Specific Configuration.
repo_name: dqm-ml-workspace
repo_url: https://github.com/Safenai/dqm-ml-workspace
edit_uri: edit/main/docs/user_guide/docs/
nav:
  - Home: index.md
  - Getting Started:
    - Overview: dqm-ml-overview.md
    - Why a dqm-ml V2: dqm-ml-v2.md
  - User Guide:
    - cli usage: configuration.md
    - direct call: TBD1.md
  - Metrics: 
    - Overview: metrics.md
    - Completeness : metrics/completeness.md
    - Domain gap : metrics/domain_gap.md
    - Representativeness : metrics/representativeness.md
    - Visual features : metrics/visual_features.md
  - Tutorials and Examples:
    - Direct usage with Notebook: examples/multiple_metrics_tests_v2.ipynb
  # TODO: Uncomment when this documentation exists
  #   - Welding Challenge: tutorials/welding_challenge.md
  - Test reports:
    - Pytest report: reports/pytest/pytest_report.html
    - Coverage Report: reports/htmlcov/coverage_report.html
    - Performance Report: TBD2.md
  - Developer Guide:
    - Contributing: contributing.md
    - AGENTS.md: AGENTS.md
    - Roadmap: ROADMAP.md

  - API Reference: reference/

