---
compute:
  log_level: "debug"
  progress_bar: true
  threads: 4

dataloaders:
  loaders:
    - name: source_dataset
      type: parquet
      path:
      batch_size: 1000000

metrics:
  processors:
    - name: representativeness
      type: representativeness
      metrics: [chi-square, grte, shannon-entropy, kolmogorov-smirnov]
      ks:
        sample_size: 1000000
        sample_divisor: 1
      columns:
        input: [data_1, data_2, data_3]
      histogram:
        bins: 10
