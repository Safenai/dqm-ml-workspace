---
compute:
  log_level: "debug"
  seed: 42
  progress_bar: true
  threads: 4

dataloaders:
  loaders:
    - name: source_dataset
      type: parquet
      path:
      batch_size: 50

    - name: target_dataset
      type: parquet
      path:
      batch_size: 50

features:
  processors:
    - name: image_embedding
      type: features_embeddings
      columns:
        input: [image_path]
      model:
        arch: resnet18
        n_layer_feature: -2
        device: cpu
      infer:
        batch_size:
        width:
        height:
        norm_mean: [0.485, 0.456, 0.406]
        norm_std: [0.229, 0.224, 0.225]

gap:
  processors:
    - name: domain_gap
      type: domain_gap
      columns:
        input: [image_path_embedding]
      distance:
        metric:
