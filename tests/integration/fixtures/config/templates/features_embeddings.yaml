---
compute:
  log_level: "debug"
  progress_bar: true
  threads: 4

dataloaders:
  loaders:
    - name: source_dataset
      type: parquet
      path:
      batch_size: 30

features:
  outputs:
    path:
  processors:
    - name: features_embeddings
      type: features_embeddings
      columns:
        input: [image_bytes]
      model:
        arch: resnet18
        n_layer_feature: -2
        device: cpu
      infer:
        batch_size: 32
        width: 224
        height: 224
        norm_mean: [0.485, 0.456, 0.406]
        norm_std: [0.229, 0.224, 0.225]
