---
compute:
  log_level: "debug"
  seed: 42
  progress_bar: true
  threads: 4

dataloaders:
  loaders:
    - name: source_dataset
      type: parquet
      path: tests/integration/fixtures/data/completeness.parquet
      batch_size: 10000

metrics:
  processors:
    - name: completeness
      type: completeness
      columns:
        input: [column_1, column_3, column_6, column_9]
      include_per_column: true
      include_overall: true
