---
compute:
  log_level: "debug"
  seed: 42
  progress_bar: true
  threads: 4

dataloaders:
  loaders:
    - name: source_dataset
      type: parquet
      path: tests/integration/fixtures/data/diversity.parquet
      batch_size: 10000

metrics:
  processors:
    - name: diversity
      type: diversity
      columns:
        input: [column_2, column_4, column_6]
      metrics: [simpson, gini, shannon, richness]
