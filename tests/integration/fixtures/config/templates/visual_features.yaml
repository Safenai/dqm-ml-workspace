---
compute:
  log_level: "debug"
  seed: 42
  progress_bar: true
  threads: 4

dataloaders:
  loaders:
    - name: source_dataset
      type: parquet
      path:
      batch_size: 10000

features:
  outputs:
    path:
  processors:
    - name: visual_features
      type: image_features
      columns:
        input: [image_bytes]
      features: [luminosity, contrast, blur, entropy]
      grayscale: true
      normalize: true
      histogram:
        bins: 256
      laplacian_kernel: 3x3
