## Example pipeline configuration with completeness and representativeness metrics

---
compute:
  log_level: "debug"
  seed: 42
  progress_bar: true
  threads: 4

dataloaders:
  loaders:
    - name: source_dataset
      type: csv
      path: tests/integration/fixtures/data/challenge_welding.csv

metrics:
  outputs:
    path: "tests/outputs/data/metrics_pandas_welding_{}-{}.parquet"
  processors:
    - name: completeness
      type: completeness
      columns:
        input: ["blur_level", "welding-seams", "blur_level", "blur_class", "luminosity_level"]
      include_per_column: true
      include_overall: true
      include_metadata: true

    - name: representativeness
      type: representativeness
      columns:
        input: ["blur_level", "luminosity_level"]
      metrics: ["chi-square", "grte", "shannon-entropy", "kolmogorov-smirnov"]
      distribution: "normal"
