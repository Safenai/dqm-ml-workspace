# This file contains the configuration for unit tests of DQM-ML library
# For each metrics each col_name present in "columns_names" field shall be present as key in expected_scores

completeness:

    params:
        tolerance: 0.01
    columns_names:
        completeness: [
            "completeness_column_1",
            "completeness_column_3",
            "completeness_column_6",
            "completeness_column_9",
            "completeness_overall",
        ]
        completeness_batch: [
            "completeness_column_1",
            "completeness_column_3",
            "completeness_column_6",
            "completeness_column_9",
            "completeness_overall",
        ]
        completeness_no_per_column: [
            "completeness_overall",
        ]
        completeness_no_overall: [
            "completeness_column_1",
            "completeness_column_3",
            "completeness_column_6",
            "completeness_column_9",
        ]

    expected_scores:
        completeness_column_1: 0.939
        completeness_column_3: 0.920
        completeness_column_6: 0.927
        completeness_column_9: 1.0
        completeness_overall: 0.947

representativeness_not_normal_distribution:
    params:
        tolerances: [
            None,
            0.1,
            0.1,
            None
        ]
        distribution: normal
        columns_names: ["data_1", "data_2", "data_3"]
        metrics: [
            "chi-square",
            "grte",
            "shannon-entropy",
            "kolmogorov-smirnov"
        ]
        value_names: [
            "p_value",
            "grte_value",
            "entropy",
            "p_value"
        ]
        thresholds: [
            0.05,
            0.5,
            2.0,
            0.05
        ]
        interpretations: [
            ["follows_distribution", "does_not_follow_distribution"],
            ["high_representativeness", "low_representativeness"],
            ["high_diversity", "low_diversity"],
            ["follows_distribution", "does_not_follow_distribution"],
        ]
    expected_scores:
        chi-square:
            data_1: None
            data_2: None
            data_3: None

        kolmogorov-smirnov:
            data_1: None
            data_2: None
            data_3: None

        shannon-entropy:
            data_1: 2.3
            data_2: 2.3
            data_3: 2.3

        grte:
            data_1: 0.2
            data_2: 0.2
            data_3: 0.2


