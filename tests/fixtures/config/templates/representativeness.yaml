## Yaml pipeline configuration

---
config:

  dataloaders:
    source_dataset:
      type: parquet
      path:
      batch_size: 1000000
      memory_limit: 2GB
      threads: 4

  metrics_processor:

    representativeness:
      type: representativeness
      metrics: [chi-square, grte, shannon-entropy, kolmogorov-smirnov]
      ks_sample_size: 1000000
      ks_sample_divisor: 1

      input_columns: [data_1, data_2, data_3]

      output_features:  None

      distribution:
      bins: 10

  outputs :

    metrics:
      type: parquet
      path_pattern:
      columns: []

