---
pipeline_config:

  dataloaders:
    source_dataset:
      type: parquet
      path:
      batch_size: 50
      memory_limit: 2GB
      threads: 4

    target_dataset:
      type: parquet
      path:
      batch_size: 50
      memory_limit: 2GB
      threads: 4

  metrics_processor:
    image_embedding:
      type: image_embedding
      DATA:
        image_column: image_path
        mode: path
      model_config:
        arch: resnet18
        n_layer_feature: -2
        device: cpu
      infer:
        batch_size:
        width:
        height:
        norm_mean: [0.485, 0.456, 0.406]
        norm_std: [0.229, 0.224, 0.225]

    domain_gap:
      type: domain_gap
      INPUT:
        embedding_col: embedding
      DELTA:
        metric:

  compute_delta: True

  outputs :

    delta_metrics:
      type: parquet
      path_pattern:
      columns: []