# Workspace meta-package that ties together the dqm-ml sub-packages (core, images,
# job, pytorch) and defines shared dev tooling, dependency groups, and CI tasks.
[project]
name = "dqm-workspace"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "dqm-ml>=2.0.0",
    "dqm-ml-core>=2.0.0",
    "dqm-ml-images>=2.0.0",
    "dqm-ml-job>=2.0.0",
    "dqm-ml-pytorch>=2.0.0",
    "pre-commit>=4.7.0",
    "pycocotools>=2.0.11",
    "ruamel-yaml>=0.19.1",
]


[project.urls]
Homepage = "https://github.com/Safenai/dqm-ml-workspace"
Documentation = "https://safenai.github.io/dqm-ml-workspace"
Repository = "https://github.com/Safenai/dqm-ml-workspace"

# Build with setuptools; version is derived dynamically from git tags via setuptools-scm.
[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

# Discover packages under the src/ directory (src-layout convention).
[tool.setuptools.packages.find]
where = ["src"]

# Auto-generate the version file from the latest git tag.
[tool.setuptools_scm]
version_file = "src/dqm_ml_workspace/_version_.py"

# UV workspace: configure member packages and how they resolve each other.
[tool.uv.sources]
dqm-ml-core = { workspace = true }
dqm-ml-job = { workspace = true }
dqm-ml-images = { workspace = true }
dqm-ml-pytorch = { workspace = true }
dqm-ml = { workspace = true }

# Groups installed by default when running `uv sync` (dev essentials).
[tool.uv]
default-groups = ["nox", "lint", "type_check"]
constraint-dependencies = [
    "py7zr>=1.1.3",         # CVEs: algorithmic DoS, zip bomb, arbitrary file write
    "bleach>=6.4.0",         # CVEs: URI scheme sanitization bypass, Unicode bypass
    "starlette>=1.3.1",      # CVEs: DoS via ignored form limits, hostname poisoning
    "cryptography>=48.0.1",  # CVE: vulnerable OpenSSL bundled in wheels
    "tornado>=6.5.7",        # CVEs: credential leak, gzip bomb, OOB memory access
]

# All packages inside packages/ are part of this monorepo workspace.
[tool.uv.workspace]
members = ["packages/*"]

# Dependency groups of the workspace depending actions performed in the workspace
[dependency-groups]

# Session runner for all CI/dev tasks defined in noxfile.py.
nox = [
    "nox-uv>=0.8.0",
]

# Run tests with pytest, coverage, and reporting plugins.
test = [
    # pytest-sugar 1.1.1 is not yet compatible with pytest 9 (report.fspath is a str).
    "pytest>=8.4.2,<9",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    # Plugin to generate a HTML report for test results
    "pytest-html>=4.2.0",
    # Plugin to show failures and errors instantly, add a progress bar,
    # improve the test results, and make the output look better
    "pytest-sugar>=1.1.1",
    "pytest-timeout>=2.4.0",
    # to download open source datasets
    "fiftyone>=1.22.0",
    "strawberry-graphql>=0.315.7" # Security: CVE-2026-35526, CVE-2026-35523
]

type_check = [
    "mypy>=2.4.1",
    # Add "types-" stub packages as needed: https://github.com/python/typeshed/tree/main/stubs
    "types-PyYAML>=6.0.12.20261030",
]

# Lint and auto-format Python code.
lint = [
    "ruff>=0.17.3",
]

# Spell-check source and documentation files.
spell = [
    "cspell"
]

docs = [
    "mkdocs-material>=9.8.0",
    "mkdocs-htmlproofer-plugin>=1.6.0",
    "markdown-callouts>=0.4.0",

    # Python API documentation (not necessary for applications).
    "mkdocstrings[python]>=1.0.8",
    # Autodoc.
    "mkdocs-api-autonav>=0.4.0",
    "mkdocs-jupyter<0.26",  # Pin to <0.26 to avoid abs_src_path=None bug with api-autonav
    "mkdocs-simple-hooks>=0.1.5",
    # Markdown extensions for mermaid and more
    "pymdown-extensions>=12.3",
    "mkdocs-mermaid2-plugin>=1.2.3"
]

# Report third-party package licenses.
licenses = [
    "pip-licenses-cli>=4.1.0",
]

# Measure code complexity (cyclomatic, cognitive).
complexity = [
    "complexipy>=8.3.0",
]

####################################################################################
# Dev tools configurations

# Type checking: strict mode with extra error codes; overrides below handle
# untyped third-party sub-packages that we don't control.
[tool.mypy]
ignore_missing_imports = true
strict = true
enable_error_code = ["deprecated", "exhaustive-match", "explicit-override"]
exclude = 'build'
# If certain strict config options are too pedantic for a project,
# disable them selectively here by setting to false.

[[tool.mypy.overrides]]
module = "dqm_ml_job.dataloaders.parquet"
disable_error_code = ["no-untyped-call", "attr-defined", "name-defined"]

[[tool.mypy.overrides]]
module = "dqm_ml_job.outputwriter.parquet"
disable_error_code = ["no-untyped-call"]

[tool.ruff]
line-length = 120
src = ["src", "packages", "tests"]
# Ruff will automatically exclude all files listed in .gitignore as well as common temporary Python
# tool directories.
# To exclude additional folders, use extend-exclude.
extend-exclude = ["examples/*.ipynb", "examples/script/"]

# Ruleset: correctness (F, B), style (E, N), modernisation (UP), safety (SIM, PIE),
# pytest idioms (PT), pathlib usage (PTH), and import hygiene (I, TID, ISC).
[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "RUF", # ruff
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "PT", # flake-pytest-style
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
extend-ignore = [
    "RUF005",  # Allow `list + [item]` over `[*list, item]` when clearer
    "RUF100",  # Permit unused noqa directives during development
    "RUF012",  # Allow mutable default values (e.g. `x=[]`) where practical
    "I001",    # Handled by formatter; skip lint-level sorting check
]
unfixable = [
    # Disable removing unused imports by default and only enable within nox so editors don't delete
    # unused imports while the user is in the middle of editing a file on save.
    "F401",
]

# Sort imports within each section; don't force trailing commas for multi-line imports.
[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false
# For non-src directory projects, explicitly set top level package names:
# known-first-party = ["my-app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--html=pytest_report.html",
    # Force sugar on runner
    "--force-sugar",
    # Set global timeout for each test
    "--timeout=300",
    # Set full verbose
    "-vv",
    "-s",
    #"--log-cli-level=DEBUG",
]
xfail_strict = true
filterwarnings = [
    # When running tests, treat warnings as errors (e.g. -Werror).
    # See: https://docs.pytest.org/en/latest/reference/reference.html#confval-filterwarnings
    "error",
    # Add additional warning suppressions as needed here. For example, if a third-party library
    # is throwing a deprecation warning that needs to be fixed upstream:
    # "ignore::DeprecationWarning:typer",
    "ignore::DeprecationWarning:strawberry",
    "ignore::DeprecationWarning:fiftyone",
    "ignore::SyntaxWarning",
]
markers = [
    "slow: Marks tests as slow (deselect with '-m \"not slow\"')",
]

# Measure branch coverage in addition to line coverage.
[tool.coverage.run]
branch = true

# Patterns to exclude from coverage reporting (e.g. unreachable branches, TYPE_CHECKING blocks).
# See: https://coverage.readthedocs.io/en/latest/excluding.html#advanced-exclusion
[tool.coverage.report]
exclude_also = [
    "case _ as unreachable",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

# Spell-check all tracked files in the repository.
[tool.cspell]
files = ["**/*"]
